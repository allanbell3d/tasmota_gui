name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # Core + tests only; the PySide6/Kivy UIs are smoke-tested manually.
        run: pip install httpx pandas openpyxl pytest "ruff==0.16.*"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
